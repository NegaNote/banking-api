name: Deploy to AWS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 401429382691.dkr.ecr.us-east-1.amazonaws.com    # use yours

permissions:
  id-token: write    # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: auth-service
            ecs_service: auth-service
          - name: banking-service
            ecs_service: banking-service

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug OIDC Token Claims
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
            echo "OIDC Token Claims:"
            python3 -c "import sys, json, base64; p=sys.argv[1].split('.')[1]; p+='='*((4-len(p)%4)%4); print(json.dumps(json.loads(base64.b64decode(p).decode('utf-8')), indent=2))" "$TOKEN"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::401429382691:role/jdbank-github-actions
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: ./${{ matrix.service.name }}
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/jdbank/${{ matrix.service.name }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/jdbank/${{ matrix.service.name }}:latest \
            .
          docker push $ECR_REGISTRY/jdbank/${{ matrix.service.name }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/jdbank/${{ matrix.service.name }}:latest

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster jdbank-cluster \
            --service ${{ matrix.service.ecs_service }} \
            --force-new-deployment